[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "api-sentry-scanner"
version = "0.1.0"
description = "Specification-driven, evidence-led REST API security checks"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<0.29", "PyYAML>=6.0.2,<7", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4.23,<5", "ruff>=0.9,<1"]

[project.scripts]
api-sentry = "api_sentry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML/CSS and Markdown tables are clearer without arbitrary string wrapping.
"src/api_sentry/reporting.py" = ["E501"]
