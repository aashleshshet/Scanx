name: onescanx
x-platform: &platform
  build: .
  env_file: .env
  environment: &environment
    DATABASE_URL: postgresql+psycopg://onescanx:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/onescanx
    REDIS_URL: redis://redis:6379/0
    COOKIE_SECURE: "false"
    ONESCANX_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: onescanx
      POSTGRES_USER: onescanx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U onescanx -d onescanx]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *platform
    command: [python, -m, api_sentry.platform.migrate]
    restart: "no"
  api:
    <<: *platform
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    <<: *platform
    command: [celery, -A, api_sentry.platform.worker, worker, --loglevel=WARNING, --concurrency=1]
    depends_on:
      migrate:
        condition: service_completed_successfully
  beat:
    <<: *platform
    command: [celery, -A, api_sentry.platform.worker, beat, --loglevel=WARNING, --schedule=/tmp/celerybeat-schedule]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data:
  redis-data:
