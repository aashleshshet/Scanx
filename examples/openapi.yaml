openapi: 3.1.0
info:
  title: Portfolio fixture API
  version: 1.0.0
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: integer
paths:
  /orders/{order_id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: readOrder
      responses:
        '200':
          description: Order representation
        '403':
          description: Not the owner
  /search:
    get:
      operationId: search
      parameters:
        - name: q
          in: query
          schema:
            type: string
            example: notebook
      responses:
        '200':
          description: Search results
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Public health status
