name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev,web,platform]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
  infrastructure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: onescanx
          POSTGRES_USER: onescanx
          POSTGRES_PASSWORD: ci-only-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onescanx" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql+psycopg://onescanx:ci-only-fixture@localhost:5432/onescanx
      REDIS_URL: redis://localhost:6379/0
      ONESCANX_INFRA_TEST: '1'
      ONESCANX_TARGETS: '["https://api.example/v1"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,web,platform]'
      - run: python -m api_sentry.platform.migrate
      - name: Exercise PostgreSQL, Redis and the actual worker process
        run: |
          celery -A api_sentry.platform.worker worker --pool=solo --loglevel=WARNING > /tmp/worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid"' EXIT
          pytest -q tests/test_platform.py -k postgres_redis_worker
